name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # .gitmodules points at git@github.com:... -- all six submodules are
      # public, so the only thing SSH URLs need is a key. Rewriting to https
      # lets actions/checkout clone them anonymously; no deploy key or PAT.
      - name: Use https for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          modules: "qtserialport"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --parallel

      # Everything below only runs for a real push (not a PR): a plain push
      # to main auto-bumps the patch version and tags; a hand-pushed v* tag
      # cuts whatever version was asked for. One job, one run -- a tag
      # pushed here with GITHUB_TOKEN would not retrigger this workflow
      # (GitHub suppresses that to stop infinite loops), so tagging and
      # releasing happen together instead of across two runs.
      - name: Determine version
        if: github.event_name == 'push'
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [ -z "$last" ]; then
              next="v0.1.0"
            else
              ver=${last#v}
              IFS=. read -r major minor patch <<< "$ver"
              next="v$major.$minor.$((patch + 1))"
            fi
            git tag "$next"
            git push origin "$next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

      # Reuses apps/agent's packaging script unchanged: bundles the binary,
      # every non-system lib it (and its Qt plugins/QML modules) actually
      # pulls in, and a run.sh launcher -- so any distro with a new enough
      # glibc works regardless of what Qt, if any, is installed there.
      - name: Package
        if: github.event_name == 'push'
        run: |
          ./scripts/package-linux.sh build/bin/pdm_maestro \
            "pdm_maestro-${{ steps.ver.outputs.tag }}-linux-x64.tar.gz"

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: pdm_maestro-*-linux-x64.tar.gz
          body: |
            Self-contained Linux build of the PdM Maestro shell -- all five
            tabs (Motor Control, Data Collection, ML/Ops, OTA Update, AI
            Agent) in one process.

            Extract, then run **./run.sh** -- never bin/pdm_maestro
            directly. Bundles its own Qt 6.10 and every non-system library,
            so any distro with a new enough glibc works regardless of what
            Qt (if any) is installed.
          generate_release_notes: true
