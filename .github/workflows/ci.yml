name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Every app here is a private repo in the same org, and GITHUB_TOKEN
      # is scoped to exactly one repository by design -- the submodules need
      # a token of their own. CI_TOKEN is a fine-grained PAT with read-only
      # Contents access to this org's repos; rewrite both URL shapes onto it
      # (the recorded submodule URLs are SSH) and fetch the pins.
      - name: Fetch submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.CI_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.CI_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      # The union of what every app's find_package asks for (see each
      # CMakeLists.txt): Quick/Qml/Widgets/QuickControls2/Network live in
      # qtbase+qtdeclarative; motor_control needs qtserialport;
      # qtshadertools must be present for the .qsb tooling the QML build runs.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          # serialport is an add-on module, not a base archive -- passing it
          # as an archive is silently ignored and configure dies later.
          archives: qtbase qtdeclarative qtshadertools qtsvg icu qttranslations
          modules: qtserialport
          cache: true

      # data_collection's mqttclient.cpp is an unconditional source whose
      # class only exists under HAVE_MQTT -- without Paho the build dies on
      # "MqttClient does not name a type". Dev machines all have it; so must CI.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpaho-mqtt-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the full shell
        run: cmake --build build -j"$(nproc)"

      # A plain push to main auto-bumps the patch version and tags; a
      # hand-pushed v* tag cuts whatever version was asked for. Both happen
      # in this same job/run -- a tag pushed here with GITHUB_TOKEN would not
      # retrigger this workflow (GitHub suppresses that to stop infinite
      # loops), so tagging and releasing can't be split across two runs.
      - name: Determine version
        if: github.event_name == 'push'
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            # Strict vX.Y.Z only -- this repo also carries non-semver tags
            # (v0.1.0_firstdata, v0.2.0_sshkey) that 'v*' alone would match,
            # and patch+1 on a non-numeric suffix dies with a bash arithmetic error.
            last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            if [ -z "$last" ]; then
              next="v0.1.0"
            else
              ver=${last#v}
              IFS=. read -r major minor patch <<< "$ver"
              next="v$major.$minor.$((patch + 1))"
            fi
            git tag "$next"
            git push origin "$next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: github.event_name == 'push'
        run: |
          ./scripts/package-linux.sh build/bin/pdm_maestro \
            "PdM-Maestro_gui-${{ steps.ver.outputs.tag }}-linux-x64.tar.gz"

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: PdM-Maestro_gui-*-linux-x64.tar.gz
          body: |
            Self-contained Linux build of the full PdM Maestro shell — all
            five tools in one window.

            Extract, then run **./run.sh** — never bin/pdm_maestro directly.
            Bundles its own Qt 6.10 and every non-system library, so any
            distro with glibc >= 2.39 works regardless of what Qt (if any)
            is installed. Built on ubuntu-24.04. The AI Agent tab wants its
            backend from [pdm_ai_server](https://github.com/PM-Maestro-ITI-GP-Org/pdm_ai_server);
            everything else runs without one. Each tool also ships as its
            own standalone app in its own repository.
          generate_release_notes: true
